[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bidagent"
version = "0.2.0"
description = "Evidence-aware technical bid and proposal generator"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pdfplumber>=0.10",
  "Pillow>=10",
  "PyYAML>=6",
  "streamlit>=1.55,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
bidagent = "bidagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
